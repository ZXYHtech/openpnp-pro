# OpenPnP CoreXY new-machine bootstrap configuration.
# The Startup event replaces only __AUTO_X__/__AUTO_Y__ before loading the
# Agent. Existing user corexy.properties files are preserved by the installer.

schema.version=1
mode=state-offset

# Fail-safe startup defaults. The agent must pass compatibility and machine
# checks before enabled can take effect. dry-run computes and logs corrections
# but must not add compensation motion.
enabled=false
dry-run=false
fail-closed=true
require-homed=true

onboarding.state=uninitialized
production.persistence=persistent
production.acceptance=bootstrap-new-machine
production.source=new-machine-template
model.kind=FRESH_FIXED_VECTOR_V1
model.gain=1.000000000

# API-compatible mode accepts other OpenPnP builds only when all required
# internal motion-planner method signatures pass runtime checks. Change this
# to strict to require an exact implementation-version match.
openpnp.version-policy=compatible-api

# Last OpenPnP build used to create and verify this configuration.
openpnp.implementation-version=not-recorded

# Cartesian controller axes used to derive A=X+Y and B=X-Y.
axis.x.id=__AUTO_X__
axis.y.id=__AUTO_Y__

# A/B state switching thresholds.
threshold.a.mm=500.000
threshold.b.mm=500.000

# Persistent two-dimensional state offsets in machine coordinates.
# A- and B- are currently the zero reference states.
offset.a.positive.x.mm=0.000
offset.a.positive.y.mm=0.000
offset.a.negative.x.mm=0.000
offset.a.negative.y.mm=0.000
offset.b.positive.x.mm=0.000
offset.b.positive.y.mm=0.000
offset.b.negative.x.mm=0.000
offset.b.negative.y.mm=0.000

# Compensation settling move speed relative to the machine speed range.
speed-factor=0.25

# A compensated physical endpoint must retain at least this distance from an
# enabled X/Y soft limit. The agent implementation will enforce this value.
safety.soft-limit-margin.mm=1.0

# Maximum Euclidean magnitude of any combined A/B state offset.
safety.max-offset.mm=0.200
